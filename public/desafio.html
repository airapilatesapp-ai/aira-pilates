<script>
(function () {
  'use strict';
  // Second of the video (1.4x version) where Nora says "clica no botão aqui embaixo".
  var REVEAL_AT = 342;
  var SEEN_KEY = 'aira.desafio.cta';
  var cta = document.getElementById('cta'), buy = document.getElementById('buy');
  var src = new URLSearchParams(location.search).get('src') || '';
  var shown = false;

  function show(remember) {
    if (shown) return; shown = true;
    cta.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { cta.classList.add('show'); }); });
    if (remember) try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
    if (window.va) window.va('event', { name: 'desafio_cta_shown', src: src });
  }

  // Panda's player sends its current time to the page while the video plays.
  window.addEventListener('message', function (e) {
    if (!/pandavideo\.com\.br$/.test((function () { try { return new URL(e.origin).hostname; } catch (x) { return ''; } })())) return;
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
    if (!d || typeof d !== 'object') return;
    var time = Number(d.currentTime != null ? d.currentTime : d.time);
    if (/timeupdate/i.test(String(d.message || d.event || d.type || '')) && time >= REVEAL_AT) show(true);
  });

  // Back after watching up to the call to action: show it right away.
  // ?botao=1 shows it for a quick test without remembering it; ?botao=0 forgets it on this phone.
  var q = new URLSearchParams(location.search).get('botao');
  if (q === '0') try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  var seen = false; try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}
  if (seen || q === '1') show(false);

  // Checkout link comes from the site settings (Vercel: STRIPE_LINK_DESAFIO).
  Aira.config().then(function (c) {
    if (!c.linkDesafio) return;
    var u = new URL(c.linkDesafio);
    if (src) u.searchParams.set('client_reference_id', src.replace(/[^\w-]/g, '').slice(0, 60));
    buy.href = u.toString(); buy.removeAttribute('aria-disabled');
  }).catch(function () {});

  buy.addEventListener('click', function (e) {
    if (buy.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    if (window.airaMeta) airaMeta.ev('InitiateCheckout', { value: 47, currency: 'BRL' });
    if (window.va) window.va('event', { name: 'desafio_checkout_click', src: src });
  });

  if (window.airaMeta) airaMeta.ev('ViewContent', { content_name: 'Desafio 30 Dias' });
})();
</script>
