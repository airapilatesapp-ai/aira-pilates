<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find your Pilates plan · Aira</title>
<meta name="description" content="Answer 3 quick questions and get a Pilates plan made for your goal, level and time. Try 7 days free.">
<meta name="theme-color" content="#F6F3F8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Find your Pilates plan in 30 seconds">
<meta property="og:description" content="3 quick questions. A plan for your goal, level and time. 7 days free.">
<meta property="og:image" content="https://airapilates.app/assets/og.png">
<meta property="og:url" content="https://airapilates.app/start">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{width:100%;max-width:520px;margin:0 auto;padding:0 16px}
main{flex:1;padding:4px 0 40px}
.prog{display:flex;align-items:center;gap:12px;margin:6px 0 22px;min-height:40px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--plum-soft);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--plum);border-radius:3px;transition:width .35s ease}
.prog .n{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.back{border:none;background:none;padding:0;width:40px;height:40px;margin-left:-8px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--plum-deep);cursor:pointer}
.back:hover{background:var(--plum-wash)}
.back[hidden]{display:flex!important;visibility:hidden}
.view{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .view{animation:none} .prog .track i{transition:none} }
.kick{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--coral-ink);margin:0 0 8px}
.q{font-family:var(--font-display);font-weight:600;font-size:clamp(27px,7.4vw,34px);line-height:1.15;letter-spacing:-.5px;color:var(--ink);margin:0 0 22px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 18px;border-radius:20px;border:1.5px solid var(--line);background:#fff;text-align:left;font-size:17px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--plum)}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--plum);background:var(--plum-wash)}
.opt .ic{flex-shrink:0;width:42px;height:42px;border-radius:13px;background:var(--plum-wash);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--plum-deep)}
.opt .t{display:flex;flex-direction:column;line-height:1.3}
.opt .t small{font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.hint{font-size:14px;color:var(--muted);margin:18px 0 0;text-align:center}
/* Loading */
.load{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:18px}
.load svg{width:200px;height:200px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.checks li{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--muted);opacity:.35;transition:opacity .3s,color .3s}
.checks li.on{opacity:1;color:var(--ink)}
.checks .ck{width:24px;height:24px;border-radius:50%;background:var(--plum-soft);display:flex;align-items:center;justify-content:center;transition:background .3s}
.checks li.on .ck{background:var(--plum)}
/* Result */
.ready{display:flex;flex-direction:column;gap:18px}
.ready h1{font-size:clamp(28px,7.6vw,36px);letter-spacing:-.5px}
.plancard{background:var(--plum);color:#fff;border-radius:26px;padding:20px;display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.plancard svg{width:92px;height:92px;border-radius:22px}
.plancard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.plancard dt{color:#D9CCE8}
.plancard dd{margin:0;font-weight:600}
.gets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gets li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.gets svg{flex-shrink:0;margin-top:3px}
.h2s{font-family:var(--font-display);font-size:22px;font-weight:600;margin:8px 0 0}
.pick{display:flex;flex-direction:column;gap:12px}
.pl{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:20px;border:1.5px solid var(--line);background:#fff;text-align:left;cursor:pointer}
.pl.on{border:3px solid var(--plum);padding:16.5px}
.pl .rd{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid #B9AEC4;display:flex;align-items:center;justify-content:center}
.pl.on .rd{border-color:var(--plum)}
.pl.on .rd::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--plum)}
.pl .nm{flex:1;display:flex;flex-direction:column;line-height:1.3}
.pl .nm b{font-size:17px}
.pl .nm small{font-size:13px;color:var(--muted)}
.pl .pr{text-align:right;display:flex;flex-direction:column;line-height:1.25}
.pl .pr b{font-family:var(--font-display);font-size:20px;color:var(--plum-deep)}
.pl .pr small{font-size:12px;color:var(--muted)}
.pl .tag{position:absolute;top:-11px;right:16px;background:var(--coral);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.tl{list-style:none;margin:6px 0 0;padding:18px 18px 18px 22px;background:#fff;border-radius:20px;display:flex;flex-direction:column;gap:0}
.tl li{position:relative;padding:0 0 16px 28px;font-size:15px;line-height:1.4}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:'';position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:var(--plum)}
.tl li:not(:last-child)::after{content:'';position:absolute;left:6px;top:19px;bottom:0;width:2px;background:var(--plum-soft)}
.tl li:last-child::before{background:var(--coral)}
.tl b{display:block}
.tl span{color:var(--muted)}
.cta{padding:4px 0 0;display:flex;flex-direction:column;gap:8px}
.cta .fine{font-size:13px;color:var(--muted);text-align:center;margin:0}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted)}
.trust span{display:flex;gap:6px;align-items:center}
.again{border:none;background:none;color:var(--plum);font-weight:600;text-decoration:underline;cursor:pointer;padding:6px 0;align-self:center;font-size:14px}
.mini{font-size:12px;color:var(--muted-2);text-align:center;padding:0 16px 22px}
.mini a{color:inherit}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Aira home"><img src="/assets/logo.svg" alt="Aira" width="90" height="32"></a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang-btn="en" aria-pressed="true">EN</button>
      <button type="button" data-lang-btn="pt" aria-pressed="false">PT</button>
    </div>
  </div>
</header>
<main>
  <div class="col">
    <div class="prog" id="prog">
      <button type="button" class="back" id="back" aria-label="Back" data-i18n-attr="aria-label:back" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="track" aria-hidden="true"><i id="bar"></i></div>
      <span class="n" id="count"></span>
    </div>
    <div id="view" aria-live="polite"></div>
  </div>
</main>
<p class="mini"><a href="/terms" data-i18n="terms">Terms</a> · <a href="/privacy" data-i18n="privacy">Privacy</a> · <a href="/login" data-i18n="login">Already a member? Log in</a></p>

<script src="/assets/aira.js"></script>
<script src="/assets/figure.js"></script>
<script>
(function(){
'use strict';
const T = {
  en: {
    __title:'Find your Pilates plan · Aira', back:'Back', terms:'Terms', privacy:'Privacy', login:'Already a member? Log in',
    count:'{n} of 3', kick:'30-second quiz',
    q:[
      { h:'What do you want most from Pilates?', o:[['core','A stronger, flatter core'],['postura','Better posture, less back pain'],['gluteos','Toned glutes and legs'],['flex','More flexibility and calm']] },
      { h:'How much Pilates have you done?', o:[['1','None, or it’s been a while','Beginner'],['2','I know the basic moves','Intermediate'],['3','I practice regularly','Advanced']] },
      { h:'How much time do you have on most days?', o:[['10','10 minutes','Even the busiest days'],['15','15 minutes','Most popular'],['20','20 minutes'],['30','30 minutes']] }
    ],
    hint:'No equipment needed. Just a mat.',
    load:'Building your plan…', l1:'Matching your level', l2:'Picking your classes', l3:'Setting your pace',
    lv:{1:'Beginner',2:'Intermediate',3:'Advanced'},
    goal:{core:'Core',postura:'Posture',gluteos:'Glutes & legs',flex:'Flexibility'},
    focus:{core:'core strength',postura:'posture and a happier back',gluteos:'glutes and legs',flex:'flexibility and calm'},
    rk:'Your plan is ready', rh:'Pilates for your {f}, in {m} minutes a day.',
    dGoal:'Goal', dLevel:'Level', dTime:'Time', perDay:'{m} min / day',
    g1:'Classes chosen for your goal, at your level', g2:'A voice coach that counts, cues your breath and tells you when to switch', g3:'Moves get harder as you get stronger',
    choose:'Choose how to continue',
    yN:'Yearly', yS:'Just $4.17 a month', yP:'$49.99', yU:'per year', save:'Save 58%',
    mN:'Monthly', mS:'Flexible, month to month', mP:'$9.99', mU:'per month',
    t1h:'Today', t1p:'Full access to every class. You pay $0.',
    t2h:'Any time this week', t2p:'Cancel in the app in two taps and pay nothing.',
    t3h:'In 7 days', t3p:'Your plan starts: {p}. Cancel anytime.',
    cta:'Start my 7 free days', fineY:'7 days free, then $49.99/year.', fineM:'7 days free, then $9.99/month.',
    tr1:'No charge today', tr2:'Cancel anytime', tr3:'Secure checkout by Stripe',
    again:'Retake the quiz', soon:'Sign-ups open very soon.'
  },
  pt: {
    __title:'Descubra seu plano de Pilates · Aira', back:'Voltar', terms:'Termos', privacy:'Privacidade', login:'Já é assinante? Entrar',
    count:'{n} de 3', kick:'Quiz de 30 segundos',
    q:[
      { h:'O que você mais quer com o Pilates?', o:[['core','Um abdômen mais forte e definido'],['postura','Postura melhor e menos dor nas costas'],['gluteos','Glúteos e pernas tonificados'],['flex','Mais flexibilidade e calma']] },
      { h:'Quanto Pilates você já fez?', o:[['1','Nunca, ou faz tempo','Iniciante'],['2','Conheço os exercícios básicos','Intermediária'],['3','Pratico com frequência','Avançada']] },
      { h:'Quanto tempo você tem na maioria dos dias?', o:[['10','10 minutos','Até nos dias mais corridos'],['15','15 minutos','O mais escolhido'],['20','20 minutos'],['30','30 minutos']] }
    ],
    hint:'Não precisa de equipamento. Só um tapete.',
    load:'Montando seu plano…', l1:'Ajustando ao seu nível', l2:'Escolhendo suas aulas', l3:'Definindo seu ritmo',
    lv:{1:'Iniciante',2:'Intermediária',3:'Avançada'},
    goal:{core:'Abdômen',postura:'Postura',gluteos:'Glúteos e pernas',flex:'Flexibilidade'},
    focus:{core:'abdômen',postura:'postura e costas',gluteos:'glúteos e pernas',flex:'flexibilidade e calma'},
    rk:'Seu plano está pronto', rh:'Pilates para {f}, em {m} minutos por dia.',
    dGoal:'Objetivo', dLevel:'Nível', dTime:'Tempo', perDay:'{m} min / dia',
    g1:'Aulas escolhidas para o seu objetivo, no seu nível', g2:'Uma voz que conta, lembra a respiração e avisa quando trocar', g3:'Os exercícios evoluem conforme você fica mais forte',
    choose:'Escolha como continuar',
    yN:'Anual', yS:'Só US$&nbsp;4,17 por mês', yP:'US$&nbsp;49,99', yU:'por ano', save:'Economize 58%',
    mN:'Mensal', mS:'Flexível, mês a mês', mP:'US$&nbsp;9,99', mU:'por mês',
    t1h:'Hoje', t1p:'Acesso a todas as aulas. Você paga US$&nbsp;0.',
    t2h:'Durante a semana', t2p:'Cancele no app em dois toques e não pague nada.',
    t3h:'Daqui a 7 dias', t3p:'Seu plano começa: {p}. Cancele quando quiser.',
    cta:'Começar meus 7 dias grátis', fineY:'7 dias grátis, depois US$&nbsp;49,99 por ano.', fineM:'7 dias grátis, depois US$&nbsp;9,99 por mês.',
    tr1:'Nada cobrado hoje', tr2:'Cancele quando quiser', tr3:'Pagamento seguro pela Stripe',
    again:'Refazer o quiz', soon:'As inscrições abrem em breve.'
  }
};
const KEYS = ['goal','level','time'];
const POSE = { core:'hundred', postura:'swan', gluteos:'bridge', flex:'mermaid' };
const view = document.getElementById('view'), bar = document.getElementById('bar'), count = document.getElementById('count'), back = document.getElementById('back'), prog = document.getElementById('prog');
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
const check = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B3F7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const tick = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const F = window.AiraFig;

let D = T.en, step = 0, ans = {}, plan = 'yearly', links = {}, anim = 0, loadTimer = 0;
try { const s = JSON.parse(Aira.store.get('aira.quiz') || 'null'); if (s && s.goal && s.level && s.time) { ans = s; step = 4; } } catch (e) {}

// Where the visitor came from, e.g. /start?src=reel12 → shows up in Stripe as "start_reel12".
const src = (new URLSearchParams(location.search).get('src') || 'direct').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || 'direct';

/* ---------- Animated figure (same one as the app) ---------- */
function scene(id, size){
  const small = size < 120, vb = small ? '60 60 200 200' : '0 0 320 320';
  const clip = small ? '<rect x="60" y="60" width="200" height="200" rx="46"/>' : '<circle cx="160" cy="160" r="160"/>';
  return `<svg viewBox="${vb}" width="${size}" height="${size}" aria-hidden="true"><defs><clipPath id="c${id}">${clip}</clipPath></defs>
    <g clip-path="url(#c${id})"><rect width="320" height="320" fill="${small ? '#6A4C8B' : 'var(--scene)'}"/><circle cx="160" cy="130" r="64" fill="var(--scene-glow)"/><rect y="205" width="320" height="28" fill="var(--scene-mat)"/><g class="fig"></g></g></svg>`;
}
function animate(root, exId){
  cancelAnimationFrame(anim);
  if (!F || !F.EX[exId]) return;
  const g = root.querySelector('.fig'), e = F.EX[exId], t0 = performance.now();
  const paint = (p) => { const sc = p.k || 1.2; g.setAttribute('transform', `translate(${(160 - 160 * sc).toFixed(1)} ${(205 - 192 * sc).toFixed(1)}) scale(${sc.toFixed(3)})`); g.innerHTML = F.figure(p); };
  if (reduce) { paint(e.B); return; }
  const per = e.period * 1000;
  const frame = (now) => { const ph = ((now - t0) % per) / per; paint(F.mix(e.A, e.B, ph < .5 ? F.ease(ph * 2) : F.ease(1 - (ph - .5) * 2), false)); anim = requestAnimationFrame(frame); };
  anim = requestAnimationFrame(frame);
}

/* ---------- Screens ---------- */
function draw(){
  clearTimeout(loadTimer); cancelAnimationFrame(anim);
  prog.hidden = step > 3;
  back.hidden = step === 0;
  if (step <= 3) { bar.style.width = (Math.min(step, 3) / 3 * 100) + '%'; count.textContent = step < 3 ? fill(D.count, { n:step + 1 }) : ''; }
  if (step < 3) drawQuestion();
  else if (step === 3) drawLoading();
  else drawResult();
}
function drawQuestion(){
  const q = D.q[step], k = KEYS[step];
  view.innerHTML = `<div class="view">${step === 0 ? `<p class="kick">${D.kick}</p>` : ''}<h1 class="q">${q.h}</h1>
    <div class="opts">${q.o.map((o, i) => `<button type="button" class="opt${String(ans[k]) === o[0] ? ' on' : ''}" data-v="${o[0]}">
      <span class="ic">${k === 'time' ? o[0] : k === 'level' ? o[0] : '0' + (i + 1)}</span>
      <span class="t">${o[1]}${o[2] ? `<small>${o[2]}</small>` : ''}</span></button>`).join('')}</div>
    ${step === 0 ? `<p class="hint">${D.hint}</p>` : ''}</div>`;
}
function drawLoading(){
  view.innerHTML = `<div class="view load"><div id="ld">${scene('l', 200)}</div><h1 class="q" style="margin:0">${D.load}</h1>
    <ul class="checks">${[D.l1, D.l2, D.l3].map((t) => `<li><span class="ck">${tick}</span>${t}</li>`).join('')}</ul></div>`;
  animate(document.getElementById('ld'), POSE[ans.goal]);
  const items = view.querySelectorAll('.checks li');
  let i = 0;
  const next = () => {
    if (i < items.length) { items[i++].classList.add('on'); loadTimer = setTimeout(next, reduce ? 250 : 650); }
    else loadTimer = setTimeout(() => { step = 4; draw(); scrollTo(0, 0); }, reduce ? 200 : 450);
  };
  loadTimer = setTimeout(next, 350);
}
function drawResult(){
  const yearly = plan === 'yearly';
  view.innerHTML = `<div class="view ready">
    <div><p class="kick">${D.rk}</p><h1>${fill(D.rh, { f:D.focus[ans.goal], m:ans.time })}</h1></div>
    <div class="plancard"><div id="pc">${scene('p', 92)}</div>
      <dl><dt>${D.dGoal}</dt><dd>${D.goal[ans.goal]}</dd><dt>${D.dLevel}</dt><dd>${D.lv[ans.level]}</dd><dt>${D.dTime}</dt><dd>${fill(D.perDay, { m:ans.time })}</dd></dl></div>
    <ul class="gets"><li>${check}<span>${D.g1}</span></li><li>${check}<span>${D.g2}</span></li><li>${check}<span>${D.g3}</span></li></ul>
    <h2 class="h2s">${D.choose}</h2>
    <div class="pick" role="radiogroup">
      <button type="button" class="pl${yearly ? ' on' : ''}" role="radio" aria-checked="${yearly}" data-plan="yearly"><span class="tag">${D.save}</span><span class="rd"></span>
        <span class="nm"><b>${D.yN}</b><small>${D.yS}</small></span><span class="pr"><b>${D.yP}</b><small>${D.yU}</small></span></button>
      <button type="button" class="pl${yearly ? '' : ' on'}" role="radio" aria-checked="${!yearly}" data-plan="monthly"><span class="rd"></span>
        <span class="nm"><b>${D.mN}</b><small>${D.mS}</small></span><span class="pr"><b>${D.mP}</b><small>${D.mU}</small></span></button>
    </div>
    <div class="cta"><a class="btn block" id="go" href="#">${D.cta}</a><p class="fine">${yearly ? D.fineY : D.fineM}</p>
      <p class="fine" id="soon" hidden>${D.soon}</p></div>
    <div class="trust"><span>${check}${D.tr1}</span><span>${check}${D.tr2}</span><span>${check}${D.tr3}</span></div>
    <ol class="tl"><li><b>${D.t1h}</b><span>${D.t1p}</span></li><li><b>${D.t2h}</b><span>${D.t2p}</span></li><li><b>${D.t3h}</b><span>${fill(D.t3p, { p:yearly ? D.yP + ' ' + D.yU : D.mP + ' ' + D.mU })}</span></li></ol>
    <button type="button" class="again" data-again>${D.again}</button>
  </div>`;
  animate(document.getElementById('pc'), POSE[ans.goal]);
  setLink();
}
function setLink(){
  const a = document.getElementById('go'); if (!a) return;
  const url = links[plan];
  if (url) { a.href = url + (url.indexOf('?') === -1 ? '?' : '&') + 'client_reference_id=' + encodeURIComponent('start_' + src); a.removeAttribute('aria-disabled'); document.getElementById('soon').hidden = true; }
  else if (links.loaded) { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); document.getElementById('soon').hidden = false; }
}

/* ---------- Taps ---------- */
view.addEventListener('click', (e) => {
  const o = e.target.closest('.opt');
  if (o) {
    const k = KEYS[step]; ans[k] = k === 'goal' ? o.dataset.v : Number(o.dataset.v);
    o.classList.add('on');
    setTimeout(() => { step++; if (step === 3) Aira.store.set('aira.quiz', JSON.stringify(ans)); draw(); }, 160);
    return;
  }
  const p = e.target.closest('[data-plan]');
  if (p) { plan = p.dataset.plan; drawResult(); return; }
  if (e.target.closest('[data-again]')) { step = 0; ans = {}; Aira.store.del('aira.quiz'); draw(); scrollTo(0, 0); return; }
  if (e.target.closest('#go[aria-disabled]')) e.preventDefault();
});
back.addEventListener('click', () => { if (step > 0 && step < 3) { step--; draw(); } });

Aira.config().then((c) => { links = { monthly:c.linkMonthly, yearly:c.linkYearly, loaded:true }; setLink(); });
Aira.translatePage(T, (l, d) => { D = d; draw(); });
})();
</script>
</body>
</html>
