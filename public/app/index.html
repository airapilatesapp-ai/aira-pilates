<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aira</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F3F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aira">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --page:#E7E1EE; --shadow:rgba(35,26,44,.35);
  --bg:#F6F3F8; --surface:#FFFFFF; --ink:#231A2C; --muted:#5E5468; --muted-2:#6E6578;
  --plum:#5B3F7A; --plum-deep:#3E2A55; --plum-soft:#E9E1F1; --plum-wash:#F1EBF7;
  --line:#E6DFEC; --chip-line:#D6CCE0; --track-off:#C9C0D2; --empty:#EEE9F2; --radio-off:#A89DB3;
  --sage:#DCEADF; --sage-mid:#A9C6B0; --sage-deep:#6F9A7B; --sage-ink:#2F5A41;
  --peach:#F7E3D7; --peach-mid:#E9C3AE; --peach-deep:#E8A98A; --peach-ink:#8A4429; --sun:#F2C9B4;
  --lav:#CDBEDF; --lav-2:#B4A1CB; --lav-3:#8E77AB;
  --dusk:#D9DDF0; --dusk-mid:#B9C0E3; --dusk-deep:#8F98C9;
  --rose:#F3E1EA; --rose-mid:#E5C3D3; --rose-deep:#CF9DB6;
  --white:#FFFFFF; --scrim:rgba(35,26,44,.55);
  --fig-skin:#F2C6A4; --fig-skin-mid:#E8B48F; --fig-skin-2:#D29C77; --fig-hair:#3F2620; --fig-top:#E07C55;
  --fig-leg:#E8875F; --fig-leg-mid:#DA7650; --fig-leg-2:#C2653F;
  --scene:#5B3F7A; --scene-glow:#6A4C8B; --scene-mat:#3A2850;
  --font-display:'Outfit','Avenir Next',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
/* Full screen on phones; a centered phone-sized column on bigger screens. */
.phone{position:relative;width:100%;height:100dvh;background:var(--bg);color:var(--ink);overflow:hidden;isolation:isolate;margin:0 auto}
#app{position:absolute;inset:0}
@media (min-width:600px) and (min-height:700px){
  body{background:var(--page);display:flex;align-items:center;justify-content:center;padding:24px}
  .phone{width:420px;height:min(880px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 40px 70px -30px var(--shadow)}
}
/* ---------- App ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:44px 20px 24px;display:flex;flex-direction:column;gap:20px}
.h1{margin:0;font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.4px;line-height:1.15;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:600}
.sub{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.strong{font-weight:600;color:var(--plum)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;width:100%;border:none;border-radius:28px;background:var(--plum);color:var(--white);font-weight:600;font-size:16px}
.btn:hover{background:var(--plum-deep)}
.btn.sm{height:46px;font-size:15px}
.btn.ghost{background:transparent;color:var(--plum);height:48px}
.btn.ghost:hover{background:var(--plum-wash)}
.btn.line{background:transparent;color:var(--plum);border:1.5px solid var(--plum);height:46px;font-size:15px}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:none;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center}
.bottom{flex-shrink:0;padding:12px 22px 30px;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:none;background:none;padding:0;font-weight:600;font-size:14px;color:var(--plum)}

.tabbar{flex-shrink:0;height:80px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;min-height:48px;border:none;background:none;color:var(--muted-2);font-size:12px;font-weight:500}
.tabbar button[aria-current="page"]{color:var(--plum);font-weight:600}

/* Level system */
.lv{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.lv.l1{background:var(--sage);color:var(--sage-ink)}
.lv.l2{background:var(--peach);color:var(--peach-ink)}
.lv.l3{background:var(--plum-soft);color:var(--plum-deep)}
.dots{display:inline-flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:3px;background:currentColor;opacity:.3}
.dots i.on{opacity:1}
.lvchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 14px;border-radius:20px;border:1.5px solid var(--chip-line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600}
.lvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--empty)}
.seg2.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg2 button{min-height:38px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:0 4px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px var(--shadow)}
.adapt{background:var(--plum-wash);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45;color:var(--ink)}
.adapt b{font-weight:600}
.adapt ul{margin:2px 0 0;padding-left:18px;color:var(--muted)}

/* Welcome */
.hero{height:56%;min-height:300px;position:relative;background:var(--plum-soft);border-radius:0 0 40px 40px;overflow:hidden;flex-shrink:0}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;top:44px;left:24px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--plum-deep)}
.breath{transform-origin:195px 230px;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}

/* Chips & options */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--chip-line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--white)}
.chips.row{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px 2px}
.chips.row .chip{flex-shrink:0;min-height:40px;font-size:14px;white-space:nowrap}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-wash)}
.radio{flex-shrink:0;width:20px;height:20px;border-radius:10px;border:2px solid var(--radio-off);background:var(--white)}
.opt[aria-pressed="true"] .radio{border:6px solid var(--plum)}
.opt b{display:block;font-size:15px;font-weight:600}
.opt span.d{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt span.t{display:block;font-size:12px;color:var(--plum);font-weight:600;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tbtn{height:52px;border-radius:14px;border:1.5px solid var(--chip-line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600}
.tbtn[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--white)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.input{height:48px;border-radius:14px;border:1.5px solid var(--chip-line);background:var(--surface);padding:0 14px;font-size:15px;color:var(--ink);width:100%}
.input:focus{border-color:var(--plum);outline:none}

/* Modalities */
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
.mod{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;padding:2px;color:var(--ink);font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.mod .ic{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.mod[aria-pressed="true"] .ic{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--plum)}
.mod[aria-pressed="true"]{font-weight:600}

/* Home */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--peach);color:var(--peach-ink);font-size:13px;font-weight:600;white-space:nowrap}
.week{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.weekrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:32px;height:32px;border-radius:16px;background:var(--empty);display:flex;align-items:center;justify-content:center;color:var(--white)}
.dot.done{background:var(--plum)}
.dot.today{background:var(--plum-wash);border:2px dashed var(--plum)}
.dot.today.done{background:var(--plum);border:none}
.practice{overflow:hidden;display:flex;flex-direction:column}
.cover{position:relative;height:150px;overflow:hidden}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;left:14px;top:14px;height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:14px;background:var(--surface);color:var(--plum);font-size:12px;font-weight:600}
.practice .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.practice h3{margin:0;font-family:var(--font-display);font-size:22px;font-weight:600}
.metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.progcard{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.progcard p{margin:0}
.cycle{background:var(--peach);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.cycle .k{font-size:12px;font-weight:600;color:var(--peach-ink);letter-spacing:.4px;text-transform:uppercase}
.cycle p{margin:0;font-size:14px;line-height:1.45;color:var(--ink)}
.mini{border:none;text-align:left;background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.mini .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mini b{font-size:14px;line-height:1.3}

/* Class detail */
.dhero{height:230px;flex-shrink:0;position:relative;overflow:hidden}
.dhero svg.art{position:absolute;inset:0;width:100%;height:100%}
.dhero .iconbtn{position:absolute;top:40px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span.m{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:16px;background:var(--surface);font-size:13px;font-weight:500}
.poses{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink)}
.prow .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.prow b{font-size:15px;font-weight:500}
.thumb{width:72px;height:48px;flex-shrink:0;border-radius:12px;background:var(--scene);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:72px;height:48px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 16px}
.switch{flex-shrink:0;width:52px;height:32px;border-radius:16px;border:none;padding:3px;display:flex;justify-content:flex-start;background:var(--track-off);transition:background .2s}
.switch span{width:26px;height:26px;border-radius:13px;background:var(--white);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--plum)}
.switch[aria-pressed="true"] span{transform:translateX(20px)}
.note{font-size:13px;line-height:1.45;color:var(--peach-ink);background:var(--peach);border-radius:14px;padding:10px 12px;margin:0}

/* Player + exercise preview */
.player{background:var(--bg);color:var(--ink);padding:22px 20px 26px;gap:12px}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pbar .t{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;text-align:center}
.pbar .t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pbar .t span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar .c{min-width:44px;text-align:right;font-size:12px;color:var(--muted);font-weight:600}
.ptrack{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.ptrack i{display:block;height:100%;width:0;background:var(--plum)}
.stage{flex:1 1 auto;min-height:180px;position:relative;display:flex;align-items:center;justify-content:center}
.stage svg{width:100%;height:100%;max-height:330px}
.stage.rest svg{opacity:.55}
.cue{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:16px;background:var(--ink);font-size:13px;font-weight:500;color:var(--white);white-space:nowrap;max-width:calc(100% - 24px)}
.cue i{width:10px;height:10px;border-radius:5px;background:var(--lav);flex-shrink:0}
.prow2{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:88px;height:88px;flex-shrink:0}
.ring svg{position:absolute;inset:0}
.ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.ring small{font-family:var(--font-body);font-size:11px;font-weight:400;color:var(--muted)}
.pinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.pinfo h1{margin:0;font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.15}
.pinfo p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.upnext{background:var(--surface);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:56px}
.upnext .s{display:flex;flex-direction:column;gap:2px;min-width:0}
.upnext small{font-size:12px;color:var(--muted)}
.upnext b{font-size:14px}
.controls{display:flex;align-items:center;justify-content:center;gap:28px}
.cbtn{width:52px;height:52px;border-radius:26px;border:none;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -10px var(--shadow)}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn.main{width:76px;height:76px;border-radius:38px;background:var(--plum);color:var(--white)}
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:24px 22px 30px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:600}
.exstage{height:300px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;padding:36px 30px 0}
.exstage svg{width:100%;height:100%}
.exstage .iconbtn{position:absolute;top:40px;left:16px;z-index:2}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.steps li b{flex-shrink:0;min-width:88px;font-size:12px;font-weight:600;color:var(--plum);padding-top:2px;text-transform:uppercase;letter-spacing:.4px}
.vers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ver{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.ver small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ver b{font-size:14px;font-weight:600}

/* Done */
.done-mark{width:132px;height:132px;margin:0 auto;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.stat{background:var(--surface);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stat b{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.warm{background:var(--peach)}
.stat.warm b,.stat.warm span{color:var(--peach-ink)}

/* Explore */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--chip-line)}
.search:focus-within{border-color:var(--plum)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink);min-width:0}
.crow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--surface);border:none;width:100%;text-align:left;color:var(--ink)}
.crow .th{width:64px;height:64px;flex-shrink:0;border-radius:14px;overflow:hidden;position:relative}
.crow .th svg{position:absolute;inset:0;width:100%;height:100%}
.crow .thumb{width:64px;height:52px}
.crow .thumb svg{width:64px;height:52px}
.crow .tx{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.crow b{font-size:15px;line-height:1.25}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border-radius:16px}
.progs{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px}
.prog{flex-shrink:0;width:220px;border:none;padding:0;text-align:left;background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
.prog .art{height:92px;position:relative}
.prog .art svg{position:absolute;inset:0;width:100%;height:100%}
.prog .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.prog b{font-size:15px}
.bar{display:block;height:6px;border-radius:3px;background:var(--empty);overflow:hidden}
.bar i{display:block;height:100%;background:var(--plum)}

/* Progress */
.tile{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.hi{background:var(--plum);color:var(--white)}
.tile.hi span{color:var(--plum-soft)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.cal .d{height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.cal .d.done{background:var(--plum);color:var(--white);font-weight:600}
.cal .d.today{border:2px dashed var(--plum);color:var(--plum);font-weight:600}
.cal .d.today.done{border:none;color:var(--white)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{background:var(--surface);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;font-weight:600;line-height:1.3}
.bdg .ic{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.bdg.locked{background:var(--empty);color:var(--muted)}
.remind{display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.remind .r1{display:flex;align-items:center;gap:12px}
.remind select{height:44px;border-radius:12px;border:1.5px solid var(--chip-line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:15px}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,12px);background:var(--ink);color:var(--white);font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .screen,.done-mark{animation:none}
  .breath{animation:none}
}

a.btn{text-decoration:none}
/* Production additions */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg)}
.splash img{width:84px;height:84px;border-radius:20px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.banner{display:flex;gap:12px;align-items:flex-start;background:#FBEBEB;color:#7A2626;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.45}
.banner a{color:#7A2626;font-weight:600}
.acct{display:flex;flex-direction:column;gap:12px}
.acct .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.acct .row span:first-child{color:var(--muted)}
.acct .row span:last-child{font-weight:600;text-align:right}
.inst{display:flex;flex-direction:column;gap:14px}
.inst ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.inst li{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.4}
.inst li .n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--plum-soft);color:var(--plum-deep);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.inst li svg{flex-shrink:0}
@media (prefers-reduced-motion: reduce){ .splash img{animation:none} }
</style>

function t(k, v){ const d = STR[S.lang] || STR.pt; let s = d[k]; if (s === undefined) s = STR.pt[k]; return typeof s === 'function' ? s(v) : s; }
const tx = (o, f) => (S.lang === 'en' && o.en && o.en[f] !== undefined) ? o.en[f] : o[f];
const fmtTime = (hm) => { if (S.lang !== 'en') return hm; const p = hm.split(':'), h = Number(p[0]); return ((h % 12) || 12) + ':' + p[1] + ' ' + (h < 12 ? 'AM' : 'PM'); };

/* ---------------- Figure helpers ---------------- */
function poseAt(id, time, playing){
  const e = EX[id], ph = (time % e.period) / e.period; let k, cue;
  if (reduceMotion) { k = 1; cue = t('p.breathe'); }
  else if (ph < 0.5) { k = ease(ph * 2); cue = tx(e, 'cueAB'); }
  else { k = ease(1 - (ph - 0.5) * 2); cue = tx(e, 'cueBA'); }
  const p = mix(e.A, e.B, k, false);
  if (e.osc && !reduceMotion && playing) { const o = Math.sin(time * 2 * Math.PI * e.osc.hz) * e.osc.amp; e.osc.keys.forEach(key => { p[key] += o; }); }
  return { p, k, cue };
}
function paint(g, p){
  const sc = p.k || 1.2;
  g.setAttribute('transform', 'translate(' + f1(160 - 160 * sc) + ' ' + f1(205 - 192 * sc) + ') scale(' + sc.toFixed(3) + ')');
  g.innerHTML = figure(p);
}

function adaptEx(id, lvl, fixed){
  let e = id; const seen = {};
  while (EX[e].level > lvl && EX[e].easy && !seen[e]) { seen[e] = 1; e = EX[e].easy; }
  if (EX[e].level > lvl) return null;
  if (!fixed) while (EX[e].hard && !seen[e] && EX[EX[e].hard].level <= lvl && EX[EX[e].hard].level > EX[e].level) { seen[e] = 1; e = EX[e].hard; }
  return e;
}
function buildPlan(cid, lvl){
  const C = CLASSES[cid], L = LEVELS[lvl], base = [], swaps = [];
  C.list.forEach(id => { const a = adaptEx(id, lvl, C.fixed); if (!a || base.indexOf(a) !== -1) return; if (a !== id) swaps.push([id, a]); base.push(a); });
  const slots = Math.max(base.length, Math.round(C.min * 60 / (L.work + L.rest)));
  const rounds = Math.ceil(slots / base.length), seq = [];
  for (let r = 1; r <= rounds; r++) base.forEach(id => { if (seq.length < slots) seq.push({ id, round: r }); });
  const secs = seq.length * L.work + (seq.length - 1) * L.rest;
  return { base, seq, rounds, swaps, work: L.work, rest: L.rest, min: Math.max(1, Math.round(secs / 60)) };
}

/* ---------------- Voice coach ----------------
   Uses the device's own voices: a Brazilian Portuguese voice in Portuguese, a US English voice in English. */
const HAS_VOICE = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
const VOICE = { pt:null, en:null };
function pickVoices(){
  try {
    const vs = window.speechSynthesis.getVoices();
    const pick = (re, prefer) => { const pool = vs.filter(v => re.test(v.lang)); return pool.find(v => prefer.test(v.name)) || pool[0] || null; };
    VOICE.pt = pick(/^pt[-_]?BR/i, /luciana|francisca|thalita|vit[oó]ria|natural|neural|google/i) || pick(/^pt/i, /./);
    VOICE.en = pick(/^en[-_]?US/i, /samantha|ava|allison|zoe|jenny|aria|natural|neural|google us/i) || pick(/^en/i, /./);
  } catch (e) {}
}
if (HAS_VOICE) { pickVoices(); try { window.speechSynthesis.addEventListener('voiceschanged', pickVoices); } catch (e) {} }
function hush(){ if (HAS_VOICE) try { window.speechSynthesis.cancel(); } catch (e) {} }
function speak(text, opt){
  opt = opt || {};
  if ((!S.voice && !opt.force) || !HAS_VOICE) return;
  try {
    const ss = window.speechSynthesis;
    if (opt.ifIdle && (ss.speaking || ss.pending)) return;
    if (!opt.queue) ss.cancel();
    const u = new SpeechSynthesisUtterance(text), en = S.lang === 'en';
    u.lang = en ? 'en-US' : 'pt-BR';
    const v = en ? VOICE.en : VOICE.pt; if (v) u.voice = v;
    u.rate = opt.rate || 1; u.pitch = 1.05;
    ss.speak(u);
  } catch (e) {}
}
const firstSentence = (s) => (s.match(/^[^.!?]*[.!?]/) || [s])[0];

/* ---------------- Exercise preview loop ---------------- */
const PV = { raf:null, last:0, anim:0 };
function startPreview(){
  stopPreview(); PV.last = performance.now(); PV.anim = 0;
  const step = (now) => {
    const g = document.getElementById('exFig');
    if (S.screen !== 'exercise' || !g) { PV.raf = null; return; }
    const dt = Math.min(0.1, (now - PV.last) / 1000); PV.last = now; PV.anim += dt;
    const r = poseAt(S.ex, PV.anim, true);
    paint(g, r.p);
    document.getElementById('exGlow').setAttribute('r', (54 + 22 * r.k).toFixed(1));
    const c = document.getElementById('exCue'); if (c.textContent !== r.cue) c.textContent = r.cue;
    PV.raf = requestAnimationFrame(step);
  };
  PV.raf = requestAnimationFrame(step);
}
function stopPreview(){ if (PV.raf) { cancelAnimationFrame(PV.raf); PV.raf = null; } }

/* ---------------- Player engine ---------------- */
const PL = { phase:-1, said:{}, items:[], i:0, remain:0, dur:0, playing:true, anim:0, blendFrom:null, blendT:1, current:null, raf:null, last:0, cue:'', total:0, before:0, plan:null, nEx:0 };
function voiceEvents(){
  if (!S.voice || !PL.playing || speed > 1) return;
  const it = PL.items[PL.i], e = EX[it.id], el = PL.dur - PL.remain, said = PL.said;
  if (it.type === 'ex'){
    const quiet = PL.remain < 4.5 || (PL.remain < 11.5 && PL.remain > 8.5);
    if (e.period >= 4 && el > 5 && !quiet) {
      const ph = Math.floor(PL.anim / (e.period / 2));
      if (ph !== PL.phase) { PL.phase = ph; speak(tx(e, ph % 2 === 0 ? 'cueAB' : 'cueBA'), {ifIdle:true}); }
    } else if (e.period < 4 && !said.half && el >= PL.dur / 2) { said.half = 1; speak(t(PL.dur >= 40 ? 'v.half' : 'v.half2'), {ifIdle:true}); }
    if (PL.dur >= 30 && !said.ten && PL.remain <= 10.4) { said.ten = 1; speak(t('v.ten')); }
    [3, 2, 1].forEach(n => { if (!said['c' + n] && PL.remain <= n + 0.1 && PL.remain > n - 0.9) { said['c' + n] = 1; speak(t('v.' + n), {rate:1.1}); } });
  } else if (!said.prep && PL.remain <= 4 && PL.dur > 5) { said.prep = 1; speak(t('v.prep')); }
}
function startClass(id){
  S.cls = id; S.sheet = false; stopPreview();
  const plan = buildPlan(id, S.level); PL.plan = plan; PL.items = [];
  plan.seq.forEach((s, idx) => {
    PL.items.push({ type:'ex', id:s.id, dur:plan.work, n:idx + 1, round:s.round });
    if (idx < plan.seq.length - 1) PL.items.push({ type:'rest', id:plan.seq[idx + 1].id, dur:plan.rest, n:idx + 2, round:plan.seq[idx + 1].round });
  });
  PL.total = PL.items.reduce((a, b) => a + b.dur, 0); PL.nEx = plan.seq.length;
  PL.playing = true; PL.current = null; S.screen = 'player';
  app.setAttribute('lang', S.lang === 'en' ? 'en-US' : 'pt-BR');
  app.innerHTML = vPlayer(); syncPanel();
  setItem(0); startLoop();
}
function nextExIndex(from){ for (let j = from + 1; j < PL.items.length; j++) if (PL.items[j].type === 'ex') return j; return -1; }
function setItem(i, silent){
  const it = PL.items[i], e = EX[it.id], rest = it.type === 'rest', q = (x) => document.getElementById(x), name = tx(e, 'name'), tip = tx(e, 'tip');
  PL.i = i; PL.dur = it.dur; PL.remain = it.dur; PL.anim = 0; PL.cue = ''; PL.phase = -1; PL.said = {};
  PL.blendFrom = PL.current; PL.blendT = PL.current ? 0 : 1;
  PL.before = PL.items.slice(0, i).reduce((a, b) => a + b.dur, 0);
  if (!q('pName')) return;
  q('pName').textContent = rest ? t('p.rest') : name;
  q('pTip').textContent = rest ? t('p.restTip') + tip : tip;
  q('pCount').textContent = t('p.count', {n:it.n, t:PL.nEx, r:it.round, R:PL.plan.rounds});
  q('pTimeL').textContent = rest ? t('p.restL') : t('p.left');
  q('pStage').classList.toggle('rest', rest);
  const nx = nextExIndex(i);
  if (rest) { q('pNextL').textContent = t('p.next'); q('pNext').textContent = name; }
  else if (nx !== -1) { q('pNextL').textContent = t('p.after'); q('pNext').textContent = tx(EX[PL.items[nx].id], 'name'); }
  else { q('pNextL').textContent = t('p.last'); q('pNext').textContent = t('p.lastTxt'); }
  q('pPrev').disabled = it.n === 1;
  q('pNextB').setAttribute('aria-label', nx !== -1 ? t('p.nextB') : t('p.finish'));
  if (!silent && speed < 10) {
    if (rest) speak(t('v.rest', {s:it.dur, n:name}));
    else if (i === 0) speak(t('v.start', {n:name, tip}));
    else speak(name + '. ' + (PL.items[i - 1].type === 'rest' ? firstSentence(tip) : tip));
  }
}
function startLoop(){
  if (PL.raf) cancelAnimationFrame(PL.raf);
  PL.last = performance.now();
  const step = (now) => {
    if (S.screen !== 'player' || !document.getElementById('pFig')) { PL.raf = null; return; }
    const dt = Math.min(0.1, (now - PL.last) / 1000); PL.last = now;
    if (PL.playing){
      PL.anim += dt; PL.remain -= dt * speed;
      if (PL.remain <= 0) { advance(); if (S.screen !== 'player') { PL.raf = null; return; } }
      else voiceEvents();
    }
    PL.blendT = Math.min(1, PL.blendT + dt / 0.9);
    draw();
    PL.raf = requestAnimationFrame(step);
  };
  PL.raf = requestAnimationFrame(step);
}
function stopPlayer(){ if (PL.raf) { cancelAnimationFrame(PL.raf); PL.raf = null; } hush(); }
function draw(){
  const it = PL.items[PL.i]; let target, cue, k;
  if (it.type === 'rest') { target = Object.assign({}, EX[it.id].A); k = 0.3; cue = t('p.cueRest', tx(EX[it.id], 'name')); }
  else { const r = poseAt(it.id, PL.anim, PL.playing); target = r.p; k = r.k; cue = r.cue; }
  const params = (PL.blendFrom && PL.blendT < 1) ? mix(PL.blendFrom, target, ease(PL.blendT), true) : target;
  PL.current = params;
  paint(document.getElementById('pFig'), params);
  document.getElementById('pGlow').setAttribute('r', (54 + 22 * k).toFixed(1));
  document.getElementById('pDot').style.transform = 'scale(' + (0.7 + 0.6 * k).toFixed(2) + ')';
  if (!PL.playing) cue = t('p.paused');
  if (cue !== PL.cue) { PL.cue = cue; document.getElementById('pCue').textContent = cue; }
  document.getElementById('pTime').textContent = mmss(PL.remain);
  document.getElementById('pRing').setAttribute('stroke-dashoffset', (238.8 * (1 - PL.remain / PL.dur)).toFixed(1));
  document.getElementById('pTrack').style.width = (100 * (PL.before + PL.dur - PL.remain) / PL.total).toFixed(2) + '%';
}
function advance(){ if (PL.i < PL.items.length - 1) setItem(PL.i + 1); else finish(); }
function finish(){
  stopPlayer();
  const m = Math.max(1, Math.round(PL.total / 60));
  if (!S.todayDone) { S.todayDone = true; S.streak += 1; }
  S.best = Math.max(S.best, S.streak);
  S.todayMinutes += m; S.sessions += 1; S.mood = null;
  S.result = { min:m, poses:PL.nEx };
  S.screen = 'done'; render(false);
  speak(t('v.done', {name:S.name || t('d.you'), n:PL.nEx}));
}
function setPlaying(on, quiet){
  PL.playing = on;
  const b = document.getElementById('pPlay');
  if (b) { b.innerHTML = on ? I.pause : I.playBig; b.setAttribute('aria-label', on ? t('p.pause') : t('p.resume')); }
  PL.cue = ''; PL.phase = -1;
  if (quiet) return;
  if (on) speak(t('v.go')); else hush();
}
function setLevel(l){
  if (S.level === l) { S.sheet = false; if (S.screen !== 'player') render(true); return; }
  S.level = l; S.sheet = false;
  if (S.screen !== 'player') render(true); else syncPanel();

function setLang(l){
  if (S.lang === l) return;

    /* rebuild the class screen in the new language, keeping the place in the class */
    const keep = { i:PL.i, remain:PL.remain, anim:PL.anim, playing:PL.playing, cur:PL.current };
    app.setAttribute('lang', l === 'en' ? 'en-US' : 'pt-BR');
    app.innerHTML = vPlayer(); setItem(keep.i, true);

document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('overlay') && e.target.dataset.act === 'sheet-bg') { S.sheet = false; render(true); return; }
  const el = e.target.closest('[data-go],[data-act],[data-speed]');
  if (!el || el.dataset.act === 'sheet-bg') return;
  if (el.dataset.speed) {
    speed = Number(el.dataset.speed);
    document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    return;
  }
  if (el.dataset.go) { if (S.screen === 'player') stopPlayer(); go(el.dataset.go); return; }
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'goal': { const i = S.goals.indexOf(id); if (i === -1) S.goals.push(id); else S.goals.splice(i, 1); render(true); break; }
    case 'level': S.level = Number(id); render(true); break;
    case 'time': S.time = Number(id); render(true); break;
    case 'create': go('home'); toast(t('t.created', lvName(S.level))); break;
    case 'open':
      if (S.screen === 'player') stopPlayer();
      if (S.screen !== 'class' && S.screen !== 'exercise') S.from = ['home','explore','progress'].indexOf(S.screen) !== -1 ? S.screen : 'home';
      S.cls = id; S.sheet = false; S.screen = 'class'; render(false); break;
    case 'ex-open':
      if (S.screen === 'player') stopPlayer();
      S.exFrom = S.screen === 'class' ? 'class' : (['home','explore','progress'].indexOf(S.screen) !== -1 ? S.screen : 'explore');
      S.ex = id; S.screen = 'exercise'; render(false); break;
    case 'ex-switch': hush(); S.ex = id; render(false); break;
    case 'ex-back': hush(); S.screen = S.exFrom; render(false); break;
    case 'ex-listen': { const x = EX[S.ex]; if (!HAS_VOICE) { toast(t('v.none')); break; } speak(t('v.listen', {n:tx(x,'name'), tip:tx(x,'tip'), a:tx(x,'cueAB'), b:tx(x,'cueBA')}), {force:true}); break; }
    case 'library': if (S.screen === 'player') stopPlayer(); S.tab = 'exercicios'; S.query = ''; go('explore'); break;
    case 'fav': S.favs[S.cls] = !S.favs[S.cls]; render(true); toast(t(S.favs[S.cls] ? 't.fav' : 't.unfav')); break;
    case 'voice': S.voice = !S.voice; render(true); if (!HAS_VOICE) toast(t('v.none')); else if (S.voice) speak(t('v.on')); else hush(); break;
    case 'pvoice':
      S.voice = !S.voice; el.setAttribute('aria-pressed', String(S.voice)); el.innerHTML = S.voice ? I.vol : I.mute; el.style.color = S.voice ? 'var(--plum)' : 'var(--muted-2)';
      if (!HAS_VOICE) toast(t('v.none')); else if (S.voice) { speak(t('v.on')); toast(t('v.onT')); } else { hush(); toast(t('v.offT')); }
      break;
    case 'start': startClass(id || S.cls); break;
    case 'toggle': setPlaying(!PL.playing); break;
    case 'prev': {
      let j = -1; const cur = PL.items[PL.i];
      for (let k = PL.i - 1; k >= 0; k--) if (PL.items[k].type === 'ex' && (cur.type === 'rest' || PL.items[k].n < cur.n)) { j = k; break; }
      if (j !== -1) setItem(j); break;
    }
    case 'next': { const j = nextExIndex(PL.i); if (j === -1) finish(); else setItem(j); break; }
    case 'ask-exit': setPlaying(false); document.getElementById('pExit').hidden = false; break;
    case 'stay': document.getElementById('pExit').hidden = true; setPlaying(true); break;
    case 'exit': stopPlayer(); S.screen = 'class'; render(false); break;
    case 'mood': S.mood = id; render(true); break;
    case 'tab': S.tab = id; S.query = ''; render(true); break;
    case 'mod': S.mod = id; render(true); break;
    case 'focus': S.focus = id; render(true); break;
    case 'mod-go': S.tab = 'aulas'; S.mod = id; S.query = ''; go('explore'); break;
    case 'sheet': S.sheet = true; render(true); break;
    case 'sheet-close': S.sheet = false; render(true); break;
    case 'setlevel': setLevel(Number(id)); break;
    case 'lang': setLang(id); break;
    case 'reminder': S.reminder = !S.reminder; render(true); toast(S.reminder ? t('t.remOn', fmtTime(S.reminderTime)) : t('t.remOff')); break;
    case 'reset': stopPlayer(); stopPreview(); S = fresh(S.lang); render(false); break;
  }
});

/* ---------- Real progress instead of the demo numbers ---------- */
function prodFresh(){
  const s = fresh(Aira.lang());
  return Object.assign(s, { name:'', streak:0, best:0, sessions:0, todayDone:false, todayMinutes:0, log:{}, onboarded:false, installSeen:false, screen:'home' });
}
isDone = function(d){ return !!(S.log || {})[ymd(d)]; };
function monthMinutes(){ const p = ymd(today).slice(0, 7); let m = 0; Object.keys(S.log || {}).forEach((k) => { if (k.slice(0, 7) === p) m += S.log[k]; }); return m; }
function computeStats(){
  const log = S.log || {};
  S.todayDone = !!log[ymd(today)]; S.todayMinutes = log[ymd(today)] || 0;
  let n = 0; const d = new Date(today); if (!S.todayDone) d.setDate(d.getDate() - 1);
  while (log[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  S.streak = n;
  let best = 0, run = 0, prev = null;
  Object.keys(log).sort().forEach((k) => { const cur = new Date(k + 'T12:00:00'); run = (prev && Math.round((cur - prev) / DAY) === 1) ? run + 1 : 1; best = Math.max(best, run); prev = cur; });
  S.best = Math.max(best, n);
}
finish = function(){
  stopPlayer();
  const m = Math.max(1, Math.round(PL.total / 60)), k = ymd(new Date());
  S.log = S.log || {}; S.log[k] = (S.log[k] || 0) + m;
  S.sessions += 1; S.mood = null; computeStats();
  S.result = { min:m, poses:PL.nEx };
  if (!ACC.standalone && !S.installSeen) S.showInstall = true;
  S.screen = 'done'; render(false);
  speak(t('v.done', { name:S.name || t('d.you'), n:PL.nEx }));
};

/* ---------- Saving: on the phone right away, in Supabase a moment later ---------- */
let lastSnap = '', saveTimer = null;
const localKey = () => 'aira.state.' + (ACC.user ? ACC.user.id : 'guest');
function snapshot(){ const o = {}; KEEP.forEach((k) => { o[k] = S[k]; }); return o; }
function persist(){
  if (!ACC.user) return;
  const snap = snapshot(), str = JSON.stringify(snap);
  if (str === lastSnap) return;
  lastSnap = str; snap.updated = Date.now();
  Aira.store.set(localKey(), JSON.stringify(snap));
  clearTimeout(saveTimer); saveTimer = setTimeout(() => pushRemote(snap), 2000);
}
function pushRemote(snap){
  if (!ACC.sb || !ACC.user) return;
  ACC.sb.from('progress').upsert({ user_id:ACC.user.id, data:snap || JSON.parse(Aira.store.get(localKey()) || '{}'), updated_at:new Date().toISOString() }).then(() => {}, () => {});
}
async function loadProgress(){
  let local = null, remote = null;
  try { local = JSON.parse(Aira.store.get(localKey()) || 'null'); } catch (e) {}
  try { const r = await ACC.sb.from('progress').select('data').eq('user_id', ACC.user.id).maybeSingle(); remote = r.data && r.data.data; } catch (e) {}
  const pick = !local ? remote : !remote ? local : ((remote.updated || 0) > (local.updated || 0) ? remote : local);
  const s = prodFresh();
  if (pick) KEEP.forEach((k) => { if (pick[k] !== undefined && pick[k] !== null) s[k] = pick[k]; });
  if (local && remote) {
    const a = local.log || {}, b = remote.log || {}; s.log = Object.assign({}, b);
    Object.keys(a).forEach((k) => { s.log[k] = Math.max(s.log[k] || 0, a[k]); });
    s.sessions = Math.max(local.sessions || 0, remote.sessions || 0);
  }
  if (!pick) {
    const ul = ACC.user.user_metadata && ACC.user.user_metadata.lang;
    if (!Aira.store.get('aira.lang') && (ul === 'pt' || ul === 'en')) s.lang = ul;
    try { const q = JSON.parse(Aira.store.get('aira.quiz') || 'null'); if (q) { const gs = (q.goals || [q.goal]).filter((g) => GOALS.some((x) => x.id === g)); if (gs.length) s.goals = gs; if (q.level) s.level = Number(q.level); if (q.time) s.time = Number(q.time); if (q.name && !s.name) s.name = String(q.name).slice(0, 20); } } catch (e) {}
  }
  return s;
}

  </div></div></div>`;
}
function fatal(msg){
  app.innerHTML = `<div class="splash"><img src="/assets/icon-192.png" alt="Aira"><p class="sub" style="max-width:280px;text-align:center;margin:0">${msg}</p><button type="button" class="btn" style="width:auto;padding:0 28px" onclick="location.reload()">${px('retry')}</button></div>`;
}

VIEWS.paywall = vPaywall;
VIEWS.welcome = () => { S.screen = S.onboarded ? 'home' : 'goals'; return VIEWS[S.screen](); };
const baseGoals = VIEWS.goals, baseHome = VIEWS.home, baseProgress = VIEWS.progress, baseDone = VIEWS.done;
VIEWS.goals = () => baseGoals().replace('class="iconbtn" style="background:transparent" data-go="welcome"', `class="iconbtn" style="background:transparent${S.onboarded ? '' : ';visibility:hidden'}" data-go="home"`);
VIEWS.home = () => {
  let h = baseHome().replace('<div class="scroll"><div class="pad">', '<div class="scroll"><div class="pad">' + payBanner());
  if (S.showInstall) h = h.replace(/<\/div>\s*$/, installSheet() + '</div>');
  return h;
};
VIEWS.done = () => baseDone();
VIEWS.progress = () => baseProgress().replace(/<section class="card remind">[\s\S]*?<\/section>/, accountCard());

/* ---------- Hooks into the app ---------- */
const baseRender = render;
render = function(keep){ baseRender(keep); persist(); };
const baseSetLang = setLang;
setLang = function(l){
  baseSetLang(l); Aira.setLang(l); persist();
  if (ACC.sb) ACC.sb.auth.updateUser({ data:{ lang:l } }).then(() => {}, () => {});
};
// One tap into the Stripe portal (cancel, change plan, update card), already signed in.
async function openPortal(el){
  if (el.disabled) return;
  const label = el.textContent; el.disabled = true; el.textContent = px('opening');
  try {
    const token = (await ACC.sb.auth.getSession()).data.session.access_token;
    const r = await fetch('/api/portal-session', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token }, body:JSON.stringify({ lang:S.lang }) });
    const d = await r.json();
    if (r.ok && d.url) { Aira.store.del('aira.sub'); location.href = d.url; return; }
    throw new Error(d.error || r.status);
  } catch (e) {
    const pu = portalUrl();
    if (pu) { location.href = pu; return; }
    alertMsg(px('portalErr', { m:esc(ACC.cfg.supportEmail || 'airapilates.app@gmail.com') }));
  }
  el.disabled = false; el.textContent = label;
}
function alertMsg(html){
  let t = document.getElementById('aira-toast');
  if (!t) { t = document.createElement('div'); t.id = 'aira-toast'; t.setAttribute('role', 'status'); t.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:99;background:#231A2C;color:#fff;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.2)'; document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 6000);
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'create') { S.onboarded = true; if (!ACC.standalone && !S.installSeen) S.showInstall = true; }
  if (act === 'inst-close' && (e.target === el || el.tagName === 'BUTTON')) { S.showInstall = false; S.installSeen = true; render(true); }
  if (act === 'inst-go' && ACC.promptEvt) { ACC.promptEvt.prompt(); ACC.promptEvt.userChoice.finally(() => { ACC.promptEvt = null; S.showInstall = false; S.installSeen = true; render(true); }); }
  if (act === 'portal') { openPortal(el); return; }
  if (act === 'signout') { clearTimeout(saveTimer); pushRemote(); Aira.store.del('aira.sub'); ACC.sb.auth.signOut().finally(() => location.replace('/login')); }
}, true);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); ACC.promptEvt = e; });
window.addEventListener('appinstalled', () => { S.installSeen = true; S.showInstall = false; persist(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && ACC.user) { clearTimeout(saveTimer); pushRemote(); } });

/* ---------- Start: who is this, and has she paid? ---------- */
async function boot(){
  try { ACC.cfg = await Aira.config(); ACC.sb = await Aira.supabase(); }
  catch (e) { return fatal(px('cfg')); }
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('error') || hash.get('error_code')) { location.replace('/login' + location.hash); return; }
  let session = null;
  try { session = (await ACC.sb.auth.getSession()).data.session; } catch (e) {}
  if (!session) { location.replace('/login'); return; }
  ACC.user = session.user;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  try {
    const r = await ACC.sb.from('subscribers').select('status,plan,current_period_end,trial_end,cancel_at_period_end').maybeSingle();
    if (r.error) throw r.error;
    ACC.sub = r.data;
    Aira.store.set('aira.sub', JSON.stringify({ sub:r.data, at:Date.now() }));
  } catch (e) {
    let c = null; try { c = JSON.parse(Aira.store.get('aira.sub') || 'null'); } catch (x) {}
    if (c && Date.now() - c.at < 14 * DAY) ACC.sub = c.sub; else return fatal(px('net'));
  }
  S = await loadProgress();
  computeStats();
  lastSnap = JSON.stringify(snapshot());
  S.screen = (!ACC.sub || ALLOWED.indexOf(ACC.sub.status) === -1) ? 'paywall' : (S.onboarded ? 'home' : 'goals');
  if (S.screen === 'home' && !ACC.standalone && !S.installSeen) S.showInstall = true;
  render(false);
  ACC.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.replace('/login'); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js', { scope:'/app/' }).catch(() => {});
}
boot();

})();
</script>
